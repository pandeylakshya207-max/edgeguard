name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build the image (OpenCV 4.10) and run the tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # The builder stage compiles everything and runs the test suite, so a
      # failing test fails this step.
      - name: Build the image
        run: docker build --progress=plain -f docker/Dockerfile -t edgeguard .

      - name: Run the tests again, for a readable log
        run: |
          docker build -f docker/Dockerfile --target builder -t edgeguard-builder .
          docker run --rm edgeguard-builder ./build/edgeguard_tests

      - name: Start each tool in the runtime image under the deployment limits
        run: |
          docker run --rm --cpus=1 --memory=512m edgeguard --help
          docker run --rm --cpus=1 --memory=512m --entrypoint /app/edgeguard_bench edgeguard --help
          docker run --rm --cpus=1 --memory=512m --entrypoint /app/edgeguard_eval edgeguard --help
